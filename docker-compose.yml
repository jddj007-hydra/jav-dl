services:
  aria2:
    build:
      context: ./aria2
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - ARIA2_SECRET=${ARIA2_SECRET:-jav-dl-rpc}
      - TZ=Asia/Shanghai
    volumes:
      - jav-data:/data
      - jav-downloads:/downloads
    ports:
      - "6881:6881"
      - "6881:6881/udp"

  web:
    build: .
    restart: unless-stopped
    depends_on:
      - aria2
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import base64, os, urllib.request
          req = urllib.request.Request("http://127.0.0.1:8787/api/health")
          user, password = os.environ.get("AUTH_USER", ""), os.environ.get("AUTH_PASS", "")
          if user and password:
              token = base64.b64encode(f"{user}:{password}".encode()).decode()
              req.add_header("Authorization", f"Basic {token}")
          urllib.request.urlopen(req, timeout=8).read()
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    ports:
      - "8787:8787"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - TZ=Asia/Shanghai
      - DATA_DIR=/data
      - DOWNLOAD_DIR=/downloads
      - MEDIA_DIR=/media
      - SCRAPE_ENABLED=${SCRAPE_ENABLED:-true}
      - ARIA2_RPC=http://aria2:6800/jsonrpc
      - ARIA2_SECRET=${ARIA2_SECRET:-jav-dl-rpc}
      - PROXY_ENABLED=${PROXY_ENABLED:-false}
      - PROXY_URL=${PROXY_URL:-http://host.docker.internal:7890}
      - AUTH_USER=${AUTH_USER:-}
      - AUTH_PASS=${AUTH_PASS:-}
      - DOWNLOADER=${DOWNLOADER:-aria2}
      - XUNLEI_URL=${XUNLEI_URL:-http://host.docker.internal:2345}
      - XUNLEI_USERNAME=${XUNLEI_USERNAME:-}
      - XUNLEI_PASSWORD=${XUNLEI_PASSWORD:-}
      - XUNLEI_DEVICE_NAME=${XUNLEI_DEVICE_NAME:-群晖-xunlei}
    volumes:
      - jav-data:/data
      - jav-downloads:/downloads
      - jav-media:/media

volumes:
  jav-data:
  jav-downloads:
  jav-media:
